<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A little star that wonders how long is left of your workday.">
    <meta name="theme-color" content="#3b2f6b">
    <title>Twinkle Twinkle — How I Wonder When You're Done</title>
    <link rel="stylesheet" href="styles.css?v=twinkle-v2">
    <script src="script.js?v=twinkle-v2" defer></script>
  </head>
  <body>
    <!-- Everything in here is decoration. None of it carries meaning that is
         not also written out in the card below. -->
    <div class="sky" aria-hidden="true">
      <div id="starfield" class="starfield"></div>

      <svg class="moon" viewBox="0 0 100 100">
        <circle class="moon-body" cx="50" cy="50" r="40"/>
        <g class="moon-craters">
          <circle cx="28" cy="27" r="6"/>
          <circle cx="77" cy="68" r="7.5"/>
          <circle cx="74" cy="30" r="4"/>
        </g>
        <g class="moon-face">
          <path d="M33 47 q6 7 12 0"/>
          <path d="M55 47 q6 7 12 0"/>
          <path d="M44 62 q6 5 12 0"/>
        </g>
      </svg>

      <svg class="sun" viewBox="0 0 120 120">
        <g class="sun-rays">
          <path d="M60 2 L66 20 L54 20 Z"/><path d="M60 118 L54 100 L66 100 Z"/>
          <path d="M2 60 L20 54 L20 66 Z"/><path d="M118 60 L100 66 L100 54 Z"/>
          <path d="M19 19 L34 27 L27 34 Z"/><path d="M101 101 L86 93 L93 86 Z"/>
          <path d="M101 19 L93 34 L86 27 Z"/><path d="M19 101 L27 86 L34 93 Z"/>
        </g>
        <circle class="sun-body" cx="60" cy="60" r="34"/>
        <g class="sun-face">
          <ellipse cx="49" cy="55" rx="4" ry="5"/>
          <ellipse cx="71" cy="55" rx="4" ry="5"/>
          <path class="sun-smile" d="M50 68 q10 10 20 0 z"/>
        </g>
      </svg>

      <div class="clouds">
        <svg class="cloud cloud-a" viewBox="0 0 120 70"><use href="#cloud-shape"/></svg>
        <svg class="cloud cloud-b" viewBox="0 0 120 70"><use href="#cloud-shape"/></svg>
        <svg class="cloud cloud-c" viewBox="0 0 120 70"><use href="#cloud-shape"/></svg>
      </div>

      <span class="shooter shooter-a"></span>
      <span class="shooter shooter-b"></span>

      <div class="confetti">
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <!-- Defined once, drawn three times by the clouds above. -->
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <g id="cloud-shape">
        <g class="cloud-body">
          <ellipse cx="34" cy="42" rx="20" ry="16"/>
          <ellipse cx="60" cy="32" rx="26" ry="22"/>
          <ellipse cx="88" cy="44" rx="19" ry="15"/>
          <rect x="14" y="40" width="92" height="20" rx="10"/>
        </g>
        <g class="cloud-face">
          <ellipse cx="50" cy="38" rx="3.4" ry="4.2"/>
          <ellipse cx="70" cy="38" rx="3.4" ry="4.2"/>
          <path d="M55 47 q5 5 10 0"/>
        </g>
      </g>
    </svg>

    <main>
      <section class="card" aria-labelledby="page-title">
        <header class="intro">
          <p class="eyebrow">★ blind box no. 02</p>
          <h1 id="page-title"><span id="title-text">how I wonder when you're done</span></h1>
        </header>

        <div class="times" aria-label="Workday times">
          <label>
            <span>clock in</span>
            <input id="start-time" type="time" step="60" value="09:00">
          </label>
          <label>
            <span>clock out</span>
            <input id="end-time" type="time" step="60" value="18:00">
          </label>
        </div>

        <p id="error" class="error" role="alert" hidden></p>
        <p id="warning" class="warning" role="status" hidden></p>

        <div id="results">
          <div class="stage">
            <div class="companions" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>

            <svg id="diamond" class="diamond" viewBox="0 0 60 60" aria-hidden="true">
              <path class="diamond-body" d="M30 4 L52 24 L30 56 L8 24 Z"/>
              <path class="diamond-shine" d="M30 4 L52 24 L30 24 Z"/>
            </svg>

            <div class="sparkles" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span><span></span>
            </div>

            <svg id="star" class="star" viewBox="0 0 200 200" role="img" aria-labelledby="star-label" data-mood="asleep">
              <title id="star-label">A little star</title>
              <path class="star-body"
                d="M100 28 L117.6 75.7 L168.5 77.8 L128.5 109.3 L142.3 158.2 L100 130 L57.7 158.2 L71.5 109.3 L31.5 77.8 L82.4 75.7 Z"/>
              <g class="face">
                <g class="blush">
                  <ellipse cx="76" cy="107" rx="9" ry="6"/>
                  <ellipse cx="124" cy="107" rx="9" ry="6"/>
                </g>
                <g class="eyes-closed">
                  <path d="M79 95 q6 7 12 0"/>
                  <path d="M109 95 q6 7 12 0"/>
                </g>
                <g class="eyes-open">
                  <ellipse cx="85" cy="95" rx="5.5" ry="7"/>
                  <ellipse cx="115" cy="95" rx="5.5" ry="7"/>
                </g>
                <g class="eyes-happy">
                  <path d="M79 98 q6 -8 12 0"/>
                  <path d="M109 98 q6 -8 12 0"/>
                </g>
                <path class="mouth-small" d="M94 110 q6 5 12 0"/>
                <path class="mouth-wide" d="M90 108 q10 12 20 0 z"/>
              </g>
              <g class="zzz" aria-hidden="true">
                <text x="146" y="56">z</text>
                <text x="164" y="42">z</text>
                <text x="180" y="30">z</text>
              </g>
            </svg>

            <p id="mood-note" class="mood-note">up above the world so high</p>
          </div>

          <div class="readout">
            <strong id="percent" class="percent"><span class="pct-int">--</span><span class="pct-dec">.--</span><span class="pct-sign">%</span></strong>
            <p id="end-note" class="end-note">counting the minutes…</p>
          </div>

          <div class="progress-wrap">
            <div id="progress-track" class="track" role="progressbar" aria-label="Workday completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div id="progress-fill" class="fill"></div>
            </div>
            <div class="tray" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <p id="sr-status" class="sr-only" role="status" aria-live="polite"></p>
          </div>

          <dl class="stats">
            <div><dt>worked</dt><dd id="worked">--h --m</dd></div>
            <div><dt>left</dt><dd id="remaining">--h --m</dd></div>
            <div><dt>whole shift</dt><dd id="duration">--h --m</dd></div>
          </dl>
        </div>

        <footer>saved on this device only · nothing leaves your browser</footer>
      </section>
    </main>
  </body>
</html>
