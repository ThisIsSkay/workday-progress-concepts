<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A courier cat cycling home. Watch how far through the workday you are.">
    <meta name="theme-color" content="#2f2a52">
    <title>Courier Cat — Cycling Home</title>
    <link rel="stylesheet" href="styles.css?v=courier-v1">
    <script src="script.js?v=courier-v1" defer></script>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="page-title">
        <header class="intro">
          <p class="eyebrow">★ delivery no. 02</p>
          <h1 id="page-title"><span id="title-text">cycling home</span></h1>
        </header>

        <div class="times" aria-label="Workday times">
          <label>
            <span>clock in</span>
            <input id="start-time" type="time" step="60" value="09:00">
          </label>
          <label>
            <span>clock out</span>
            <input id="end-time" type="time" step="60" value="18:00">
          </label>
        </div>

        <p id="error" class="error" role="alert" hidden></p>
        <p id="warning" class="warning" role="status" hidden></p>

        <div id="results">
          <!-- The scene is decoration. Everything it shows is also written out
               in the readout and stats below it. -->
          <div id="scene" class="scene" aria-hidden="true">
            <div class="skyline"></div>
            <div class="hills"></div>
            <div class="street"></div>

            <div class="checkpoints">
              <span class="cp" data-at="25"><i></i></span>
              <span class="cp" data-at="50"><i></i></span>
              <span class="cp" data-at="75"><i></i></span>
            </div>

            <div class="finish">
              <span class="finish-post"></span>
              <span class="finish-sign">HOME</span>
            </div>

            <div class="road">
              <div class="road-dashes"></div>
            </div>

            <div id="rider" class="rider" data-mood="resting">
              <div class="puff"><span></span><span></span><span></span></div>
              <div class="speedlines"><span></span><span></span><span></span></div>

              <svg class="cat" viewBox="0 0 150 116">
                <!-- rear wheel -->
                <g class="wheel wheel-back">
                  <circle class="tyre" cx="34" cy="88" r="21"/>
                  <g class="spokes">
                    <path d="M34 70 V106 M16 88 H52 M21 75 L47 101 M47 75 L21 101"/>
                  </g>
                  <circle class="hub" cx="34" cy="88" r="4"/>
                </g>

                <!-- front wheel -->
                <g class="wheel wheel-front">
                  <circle class="tyre" cx="118" cy="88" r="21"/>
                  <g class="spokes">
                    <path d="M118 70 V106 M100 88 H136 M105 75 L131 101 M131 75 L105 101"/>
                  </g>
                  <circle class="hub" cx="118" cy="88" r="4"/>
                </g>

                <!-- frame -->
                <g class="frame">
                  <path d="M34 88 L76 88 M76 88 L62 48 M62 48 L102 48 M102 48 L118 88 M76 88 L102 48"/>
                  <path class="bars" d="M102 48 L108 39 M100 37 h17"/>
                  <rect class="seat" x="50" y="41" width="23" height="7" rx="3.5"/>
                </g>

                <!-- delivery crate on the rear rack -->
                <g class="crate">
                  <rect x="12" y="45" width="33" height="25" rx="6"/>
                  <path class="crate-strap" d="M28 45 V70"/>
                  <path class="crate-mark" d="M19 55 h8 M19 61 h13"/>
                </g>

                <!-- pedals: one group, rotated, so the feet orbit the crank -->
                <g class="crank">
                  <path d="M76 88 L76 74" />
                  <path d="M76 88 L76 102" />
                  <rect class="pedal" x="69" y="70" width="14" height="6" rx="3"/>
                  <rect class="pedal" x="69" y="99" width="14" height="6" rx="3"/>
                </g>

                <!-- Cat sits ON the seat and leans toward the bars. Three
                     overlapping ellipses in one fill read as a single leaning
                     body far more reliably than a hand-authored blob path. -->
                <g class="cat-body">
                  <path class="tail" d="M46 32 q-19 -3 -23 -19"/>
                  <path class="leg leg-far" d="M66 44 q-1 22 6 36"/>
                  <ellipse class="torso" cx="60" cy="34" rx="16" ry="13"/>
                  <ellipse class="torso" cx="80" cy="31" rx="14" ry="11"/>
                  <ellipse class="torso" cx="93" cy="30" rx="10" ry="9"/>
                  <path class="leg" d="M73 44 q3 22 3 36"/>
                  <path class="arm" d="M97 33 q9 3 11 7"/>

                  <!-- Deliberately oversized head: the expression is the whole
                       point of this concept, and at 110px on screen a smaller
                       skull left the eyes too fine to read. -->
                  <g class="head">
                    <path class="ear ear-back" d="M95 13 L99 0 L110 10 Z"/>
                    <path class="ear ear-front" d="M112 10 L123 1 L125 18 Z"/>
                    <circle class="skull" cx="108" cy="23" r="15"/>

                    <g class="face">
                      <g class="brows"><path d="M96 12 l8 4"/><path d="M122 12 l-8 4"/></g>
                      <g class="eyes-open"><circle cx="101" cy="22" r="3"/><circle cx="114" cy="22" r="3"/></g>
                      <g class="eyes-squint"><path d="M97 22 h7"/><path d="M111 22 h7"/></g>
                      <!-- Bows downward. Curving these up like the happy pair
                           made the tired face read as contented. -->
                      <g class="eyes-strain"><path d="M97 21 q3.5 6 7 0"/><path d="M111 21 q3.5 6 7 0"/></g>
                      <g class="eyes-happy"><path d="M97 24 q3.5 -7 7 0"/><path d="M111 24 q3.5 -7 7 0"/></g>
                      <g class="eyes-sparkle">
                        <circle cx="101" cy="22" r="4"/><circle cx="114" cy="22" r="4"/>
                        <circle class="glint" cx="102.4" cy="20.6" r="1.4"/><circle class="glint" cx="115.4" cy="20.6" r="1.4"/>
                      </g>
                      <g class="blush"><ellipse cx="97" cy="30" rx="4.6" ry="3"/><ellipse cx="119" cy="30" rx="4.6" ry="3"/></g>
                      <path class="snout" d="M105 29 q3 3 5 0"/>
                      <path class="mouth-flat" d="M104 33 h8"/>
                      <path class="mouth-pant" d="M104 32 q4.5 8 9 0 z"/>
                      <path class="mouth-grin" d="M101 32 q7 10 14 0 z"/>
                      <path class="whiskers" d="M123 26 h9 M123 30 h8"/>
                    </g>
                  </g>
                </g>
              </svg>
            </div>

            <div class="confetti">
              <span></span><span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span>
            </div>
          </div>

          <p id="mood-note" class="mood-note">wheels up</p>

          <div class="readout">
            <strong id="percent" class="percent"><span class="pct-int">--</span><span class="pct-dec">.--</span><span class="pct-sign">%</span></strong>
            <p id="end-note" class="end-note">plotting the route…</p>
          </div>

          <div class="progress-wrap">
            <div id="progress-track" class="track" role="progressbar" aria-label="Workday completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div id="progress-fill" class="fill"></div>
            </div>
            <p id="sr-status" class="sr-only" role="status" aria-live="polite"></p>
          </div>

          <dl class="stats">
            <div><dt>ridden</dt><dd id="worked">--h --m</dd></div>
            <div><dt>to go</dt><dd id="remaining">--h --m</dd></div>
            <div><dt>whole route</dt><dd id="duration">--h --m</dd></div>
          </dl>
        </div>

        <footer>saved on this device only · nothing leaves your browser</footer>
      </section>
    </main>
  </body>
</html>
